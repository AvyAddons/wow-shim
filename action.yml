name: WoW LuaLS check
description: Runs the caller's mise lint task against the WoW API annotations
runs:
  using: composite
  steps:
    - name: Fetch annotation corpora
      shell: bash
      run: '"$GITHUB_ACTION_PATH/setup.sh"'
      env:
        SHIM_PATH: ${{ github.action_path }}
    - uses: jdx/mise-action@v4
    - name: Lint
      shell: bash
      run: mise run lint
